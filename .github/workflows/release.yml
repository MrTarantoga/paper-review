name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check tag matches plugin.json version
        run: |
          version=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version v$version"
            exit 1
          fi

      - name: Validate and test
        run: |
          python tests/validate_skill.py
          python -m unittest discover -s tests -v

      - name: Package skill
        run: |
          cd skills
          zip -r "../paper-review-${GITHUB_REF_NAME}.zip" paper-review -x '*/__pycache__/*'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "paper-review-${GITHUB_REF_NAME}.zip" \
            --title "paper-review $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
